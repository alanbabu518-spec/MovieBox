services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: moviebox-frontend:latest
    container_name: moviebox-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      server:
        condition: service_healthy
    networks:
      - moviebox-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: moviebox-backend:latest
    container_name: moviebox-server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: http://localhost:3000
      DATABASE_URL: postgresql://moviebox:${POSTGRES_PASSWORD:-moviebox_dev_password}@postgres:5432/moviebox
      REDIS_URL: redis://redis:6379
    ports:
       - "5001:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - moviebox-network

  postgres:
    image: postgres:18-alpine
    container_name: moviebox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: moviebox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moviebox_dev_password}
      POSTGRES_DB: moviebox
    ports:
      - "5433:5432"
    volumes:
      - moviebox_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moviebox -d moviebox"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - moviebox-network

  redis:
    image: redis:7-alpine
    container_name: moviebox-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - moviebox_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - moviebox-network

networks:
  moviebox-network:
    driver: bridge

volumes:
  moviebox_postgres_data:
  moviebox_redis_data: